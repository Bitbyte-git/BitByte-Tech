<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg" width="240" height="240" style="display:block;">
          <defs>
            <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5c5a0"/>
              <stop offset="100%" stop-color="#e8a882"/>
            </linearGradient>
            <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#06D6A0"/>
              <stop offset="100%" stop-color="#0077B6"/>
            </linearGradient>
            <linearGradient id="lapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1a2a3a"/>
              <stop offset="100%" stop-color="#0d1824"/>
            </linearGradient>
            <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#020b14"/>
              <stop offset="100%" stop-color="#061828"/>
            </linearGradient>
            <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#06D6A0" stop-opacity="0"/>
              <stop offset="50%" stop-color="#00B4D8" stop-opacity="1"/>
              <stop offset="100%" stop-color="#0077B6" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="softglow">
              <feGaussianBlur stdDeviation="6" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="screenLight" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#2a1a0e"/>
              <stop offset="100%" stop-color="#1a0e06"/>
            </linearGradient>
          </defs>

          <!-- Screen glow on face/body -->
          <ellipse cx="140" cy="155" rx="90" ry="70" fill="url(#screenLight)" opacity="0.7"/>

          <!-- ── CHAIR BACK (subtle) ── -->
          <rect x="95" y="175" width="90" height="12" rx="6" fill="#0d1f30" opacity="0.6"/>
          <rect x="108" y="170" width="6" height="55" rx="3" fill="#0a1a28" opacity="0.5"/>
          <rect x="166" y="170" width="6" height="55" rx="3" fill="#0a1a28" opacity="0.5"/>

          <!-- ── BODY / SHIRT ── -->
          <ellipse cx="140" cy="210" rx="52" ry="38" fill="url(#shirtGrad)" opacity="0.95"/>
          <!-- shirt collar detail -->
          <path d="M122 180 Q140 190 158 180 L162 195 Q140 205 118 195 Z" fill="rgba(255,255,255,0.12)"/>
          <!-- shirt highlight -->
          <ellipse cx="128" cy="200" rx="14" ry="22" fill="rgba(6,214,160,0.1)" transform="rotate(-12,128,200)"/>

          <!-- ── ARMS ── -->
          <!-- left arm -->
          <path d="M93 195 Q78 205 72 225 Q68 235 80 238 Q90 240 96 228 Q100 215 110 205" fill="url(#skinGrad)" stroke="#d49070" stroke-width="0.5"/>
          <!-- right arm -->
          <path d="M187 195 Q202 205 208 225 Q212 235 200 238 Q190 240 184 228 Q180 215 170 205" fill="url(#skinGrad)" stroke="#d49070" stroke-width="0.5"/>

          <!-- ── HANDS on laptop ── -->
          <!-- left hand -->
          <ellipse cx="88" cy="245" rx="16" ry="9" fill="url(#skinGrad)"/>
          <rect x="75" y="241" width="8" height="5" rx="2.5" fill="#e8a882"/>
          <rect x="82" y="239" width="8" height="5" rx="2.5" fill="#e8a882"/>
          <rect x="89" y="238" width="8" height="5" rx="2.5" fill="#e8a882"/>
          <rect x="96" y="239" width="7" height="5" rx="2.5" fill="#e8a882"/>
          <!-- right hand -->
          <ellipse cx="192" cy="245" rx="16" ry="9" fill="url(#skinGrad)"/>
          <rect x="197" y="241" width="8" height="5" rx="2.5" fill="#e8a882"/>
          <rect x="190" y="239" width="8" height="5" rx="2.5" fill="#e8a882"/>
          <rect x="183" y="238" width="8" height="5" rx="2.5" fill="#e8a882"/>
          <rect x="177" y="239" width="7" height="5" rx="2.5" fill="#e8a882"/>

          <!-- ── LAPTOP BASE ── -->
          <rect x="65" y="248" width="150" height="10" rx="4" fill="url(#lapGrad)"/>
          <!-- laptop hinge -->
          <rect x="68" y="244" width="144" height="6" rx="3" fill="#0f2030"/>

          <!-- ── LAPTOP SCREEN ── -->
          <rect x="75" y="165" width="130" height="82" rx="8" fill="#0a1825" stroke="#1a3550" stroke-width="1.5"/>
          <!-- screen bezel inner -->
          <rect x="81" y="171" width="118" height="70" rx="5" fill="url(#screenGrad)"/>
          <!-- screen glow bg -->
          <rect x="81" y="171" width="118" height="70" rx="5" fill="url(#screenLight)" opacity="0.5"/>

          <!-- CODE LINES on screen -->
          <rect x="88" y="178" width="40" height="3" rx="1.5" fill="#06D6A0" opacity="0.9" filter="url(#glow)"/>
          <rect x="92" y="184" width="55" height="3" rx="1.5" fill="#00B4D8" opacity="0.8"/>
          <rect x="92" y="190" width="35" height="3" rx="1.5" fill="#0077B6" opacity="0.75"/>
          <rect x="88" y="196" width="60" height="3" rx="1.5" fill="#06D6A0" opacity="0.7"/>
          <rect x="92" y="202" width="42" height="3" rx="1.5" fill="#00B4D8" opacity="0.8"/>
          <rect x="92" y="208" width="30" height="3" rx="1.5" fill="#5b6fff" opacity="0.7"/>
          <rect x="88" y="214" width="50" height="3" rx="1.5" fill="#06D6A0" opacity="0.85" filter="url(#glow)"/>
          <rect x="92" y="220" width="65" height="3" rx="1.5" fill="#00B4D8" opacity="0.7"/>
          <rect x="92" y="226" width="28" height="3" rx="1.5" fill="#06D6A0" opacity="0.6"/>
          <!-- cursor blink -->
          <rect x="125" y="226" width="2" height="8" rx="1" fill="#06D6A0" opacity="0.95" filter="url(#glow)">
            <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
          </rect>
          <!-- screen glare -->
          <rect x="82" y="172" width="35" height="20" rx="4" fill="rgba(255,255,255,0.03)" transform="rotate(-5,82,172)"/>

          <!-- ── NECK ── -->
          <rect x="131" y="158" width="18" height="24" rx="9" fill="url(#skinGrad)"/>
          <!-- neck shadow -->
          <rect x="134" y="158" width="8" height="24" rx="4" fill="rgba(0,0,0,0.08)"/>

          <!-- ── HEAD ── -->
          <ellipse cx="140" cy="130" rx="36" ry="38" fill="url(#skinGrad)"/>
          <!-- jaw/chin shadow -->
          <ellipse cx="140" cy="158" rx="24" ry="8" fill="rgba(200,140,100,0.25)"/>

          <!-- ── HAIR ── -->
          <!-- back hair -->
          <ellipse cx="140" cy="108" rx="36" ry="28" fill="url(#hairGrad)"/>
          <!-- top hair styled -->
          <path d="M106 120 Q108 88 140 86 Q172 88 174 120" fill="url(#hairGrad)"/>
          <!-- hair side left -->
          <path d="M106 120 Q100 130 103 145 Q108 118 114 112" fill="url(#hairGrad)"/>
          <!-- hair side right -->
          <path d="M174 120 Q180 130 177 145 Q172 118 166 112" fill="url(#hairGrad)"/>
          <!-- hair highlight -->
          <path d="M124 90 Q140 85 155 91" stroke="rgba(80,50,20,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- ── FACE FEATURES ── -->
          <!-- eyes -->
          <ellipse cx="126" cy="132" rx="6.5" ry="6" fill="white"/>
          <ellipse cx="154" cy="132" rx="6.5" ry="6" fill="white"/>
          <!-- iris -->
          <ellipse cx="127" cy="133" rx="4" ry="4" fill="#2a5080"/>
          <ellipse cx="155" cy="133" rx="4" ry="4" fill="#2a5080"/>
          <!-- pupils -->
          <circle cx="127.5" cy="133.5" r="2.5" fill="#0a0a14"/>
          <circle cx="155.5" cy="133.5" r="2.5" fill="#0a0a14"/>
          <!-- eye shine -->
          <circle cx="129" cy="132" r="1" fill="white" opacity="0.9"/>
          <circle cx="157" cy="132" r="1" fill="white" opacity="0.9"/>
          <!-- eyelids -->
          <path d="M120 129 Q126 126 132 129" stroke="#2a1a0e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M148 129 Q154 126 160 129" stroke="#2a1a0e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- eyebrows -->
          <path d="M119 124 Q126 120 133 123" stroke="#2a1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M147 123 Q154 120 161 124" stroke="#2a1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- nose -->
          <path d="M138 136 Q136 146 138 150 Q140 152 142 150 Q144 146 142 136" fill="rgba(180,110,70,0.15)"/>
          <path d="M136 150 Q140 153 144 150" stroke="#d09070" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <!-- mouth — slight smile -->
          <path d="M130 158 Q140 165 150 158" stroke="#c07850" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M132 158 Q140 162 148 158" fill="rgba(160,80,50,0.2)"/>
          <!-- ear left -->
          <ellipse cx="104" cy="136" rx="7" ry="9" fill="url(#skinGrad)"/>
          <path d="M107 130 Q112 136 107 143" stroke="#d49070" stroke-width="1" fill="none"/>
          <!-- ear right -->
          <ellipse cx="176" cy="136" rx="7" ry="9" fill="url(#skinGrad)"/>
          <path d="M173 130 Q168 136 173 143" stroke="#d49070" stroke-width="1" fill="none"/>

          <!-- ── FLOATING CIRCUIT NODES (decorative) ── -->
          <circle cx="55" cy="200" r="3" fill="#06D6A0" opacity="0.6" filter="url(#glow)">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="225" cy="210" r="3" fill="#00B4D8" opacity="0.6" filter="url(#glow)">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="48" cy="150" r="2" fill="#0077B6" opacity="0.5">
            <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="232" cy="160" r="2" fill="#06D6A0" opacity="0.5">
            <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <!-- circuit lines -->
          <line x1="55" y1="200" x2="70" y2="200" stroke="#06D6A0" stroke-width="1" opacity="0.3"/>
          <line x1="210" y1="210" x2="225" y2="210" stroke="#00B4D8" stroke-width="1" opacity="0.3"/>

          <!-- ── SCREEN REFLECTION on face ── -->
          <ellipse cx="140" cy="136" rx="28" ry="22" fill="rgba(0,180,216,0.04)"/>
        </svg>